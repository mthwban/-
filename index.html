
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد ثوبان | محلل أعمال وعمليات استراتيجي</title>
    
    <!-- Tailwind & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Inter:wght@300;400;600;800;900&display=swap');
        body { background-color: #020617; color: #f1f5f9; font-family: 'Cairo', sans-serif; }
        #loading-screen { position: fixed; inset: 0; background: #020617; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(212, 175, 55, 0.1); border-top: 4px solid #D4AF37; border-radius: 50%; animate: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <!-- React & Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.244.0",
    "@google/genai": "https://esm.sh/@google/genai@1.0.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="loading-screen">
        <div class="flex flex-col items-center gap-4">
            <div class="spinner"></div>
            <p class="text-[#D4AF37] font-bold animate-pulse">جاري تحميل منصة ثوبان الاستراتيجية...</p>
        </div>
    </div>
    <div id="root"></div>

    <!-- تشغيل التطبيق مع معالجة الأخطاء -->
    <script type="text/babel" data-type="module" data-presets="react,typescript">
        import './index.tsx';
        window.addEventListener('load', () => {
            const loader = document.getElementById('loading-screen');
            if(loader) loader.style.display = 'none';
        });
    </script>
</body>
</html>
