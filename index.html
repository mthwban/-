                            <button className="px-8 py-4 bg-[#c29b40] text-white font-black rounded-xl flex items-center gap-3 shadow-lg hover:bg-[#d4b05a] transition-all no-print">
                                <FileDown className="w-5 h-5" /> {content.cta[lang]}
                            </button>
                        </div>

                        {/* Professional Development / In Progress Card */}
                        <div className="mb-12">
                            <div className="glass-card p-10 md:p-14 rounded-[3.5rem] border border-[#c29b40]/30 bg-gradient-to-br from-[#006233]/10 to-transparent overflow-hidden">
                                <div className="relative z-10 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                                    <div>
                                        <div className="inline-flex items-center gap-2 px-4 py-1.5 mb-6 rounded-full bg-[#c29b40]/10 border border-[#c29b40]/20">
                                            <Zap className="w-4 h-4 text-[#c29b40] animate-pulse" />
                                            <span className="text-[#c29b40] text-[10px] font-black uppercase tracking-widest">{content.inProgressTitle[lang]}</span>
                                        </div>
                                        <h4 className="text-3xl md:text-4xl font-black text-white mb-4">Google Digital Marketing & E-Commerce</h4>
                                        <p className="text-slate-400 text-lg font-light">Coursera Professional Certificate in partnership with Google</p>
                                    </div>
                                    <div className="bg-[#0a0c1b]/50 p-8 rounded-[2rem] border border-white/5">
                                        <div className="flex justify-between items-end mb-4">
                                            <p className="text-white text-[10px] font-black uppercase tracking-widest opacity-60">{content.expectedSoon[lang]}</p>
                                            <p className="text-[#c29b40] text-2xl font-black">88%</p>
                                        </div>
                                        <div className="w-full h-3 bg-white/5 rounded-full overflow-hidden border border-white/5">
                                            <div className="h-full bg-gradient-to-r from-[#006233] to-[#c29b40] w-[88%] rounded-full shadow-[0_0_20px_rgba(194,155,64,0.3)]"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {CERTIFICATIONS.map((cert, i) => (
                                <div key={i} className="group glass-card p-10 rounded-[2.5rem] flex flex-col h-full hover:bg-white/5 transition-all">
                                    <Award className="w-12 h-12 text-[#c29b40] mb-8 group-hover:scale-110 transition-transform" />
                                    <h4 className="text-xl font-black text-white mb-2 leading-tight tracking-tight">{cert.title[lang]}</h4>
                                    <p className="text-slate-500 text-sm mb-8 font-medium">{cert.issuer[lang]}</p>
                                    <div className="mt-auto flex items-center justify-between pt-6 border-t border-white/5">
                                        <span className="text-[10px] font-black uppercase text-slate-600 tracking-widest">{cert.date[lang]}</span>
                                        <a href={cert.url} target="_blank" className="text-[#c29b40] flex items-center gap-2 text-[10px] font-black uppercase tracking-widest hover:text-white transition-colors">
                                            {content.verify[lang]} <ArrowUpRight className="w-4 h-4" />
                                        </a>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Skills = ({ lang }) => (
            <section id="skills" className="py-32 px-6 bg-[#0a0c1b]">
                <div className="max-w-7xl mx-auto">
                    <div className="text-center mb-20">
                        <span className="text-[#c29b40] text-xs font-black uppercase tracking-[0.5em]">{UI_STRINGS.nav.skills[lang]}</span>
                        <h2 className="text-4xl md:text-5xl font-black text-white mt-4 tracking-tighter">Technical & Leadership Mastery</h2>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                        {SKILLS.map((skill, i) => (
                            <div key={i} className="glass-card p-12 rounded-[3.5rem] border border-white/5 hover:border-[#006233]/40 transition-all group">
                                <div className="w-16 h-16 bg-[#006233]/10 rounded-2xl flex items-center justify-center mb-10 border border-[#006233]/20 group-hover:scale-110 transition-transform">
                                    {skill.icon}
                                </div>
                                <h4 className="text-2xl font-black text-white mb-8 tracking-tight group-hover:text-[#c29b40] transition-colors">{skill.category[lang]}</h4>
                                <div className="flex flex-wrap gap-3">
                                    {skill.items.map((item, idx) => (
                                        <span key={idx} className="px-4 py-2 bg-white/5 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-400 border border-white/5 hover:border-[#006233]/40 hover:text-white transition-all">
                                            {item[lang]}
                                        </span>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Contact = ({ lang }) => (
            <section id="contact" className="py-32 px-6">
                <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-20">
                    <div className={lang === 'ar' ? 'text-right' : 'text-left'}>
                        <span className="text-[#c29b40] text-xs font-black uppercase tracking-[0.5em] mb-4 block">Get in Touch</span>
                        <h3 className="text-5xl md:text-7xl font-black text-white mb-12 tracking-tighter leading-none">Let's innovate together.</h3>
                        <div className="space-y-6">
                            <a href={`mailto:${CONTACT_INFO.email}`} className="flex items-center gap-6 glass-card p-8 rounded-3xl group hover:scale-[1.02] transition-all shadow-xl">
                                <div className="w-16 h-16 bg-[#006233] rounded-2xl flex items-center justify-center text-white"><Mail className="w-8 h-8" /></div>
                                <div>
                                    <p className="text-[10px] font-black uppercase text-slate-500 tracking-widest">Email Me</p>
                                    <p className="text-xl font-bold tracking-tight">{CONTACT_INFO.email}</p>
                                </div>
                            </a>
                            <a href={CONTACT_INFO.linkedin} target="_blank" className="flex items-center gap-6 glass-card p-8 rounded-3xl group hover:scale-[1.02] transition-all shadow-xl">
                                <div className="w-16 h-16 bg-[#c29b40] rounded-2xl flex items-center justify-center text-white"><Linkedin className="w-8 h-8" /></div>
                                <div>
                                    <p className="text-[10px] font-black uppercase text-slate-500 tracking-widest">Connect</p>
                                    <p className="text-sm font-bold opacity-80 break-all">{CONTACT_INFO.linkedin}</p>
                                </div>
                            </a>
                        </div>
                    </div>
                    <div className="glass-card p-12 rounded-[4rem] border-2 border-[#006233]/20 flex flex-col justify-between">
                        <div>
                            <div className="flex items-center gap-5 mb-10">
                                <div className="w-14 h-14 bg-[#006233] rounded-2xl flex items-center justify-center text-white shadow-lg"><MapPin /></div>
                                <p className="text-xl font-black text-white tracking-tight">{lang === 'ar' ? 'المقر: المملكة العربية السعودية' : 'Based in Saudi Arabia'}</p>
                            </div>
                            <p className="text-slate-400 leading-relaxed text-xl font-light">
                                Available for high-impact Business Analysis roles, field operation leadership, and strategic performance consulting.
                            </p>
                        </div>
                        <div className="mt-12 flex items-center gap-4 italic text-[#c29b40] font-bold text-xl">
                            <span className="w-12 h-[2px] bg-[#c29b40]/30"></span> Ready for the next milestone.
                        </div>
                    </div>
                </div>
            </section>
        );

        const AIAssistant = ({ lang }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const chatEndRef = useRef(null);

            useEffect(() => {
                if (isOpen && messages.length === 0) {
                    const greeting = lang === 'ar' 
                        ? "أهلاً بك! أنا المساعد الذكي لمحمد ثوبان. كيف يمكنني مساعدتك في استكشاف خبراته؟" 
                        : "Welcome! I'm Mohamed's Strategic Assistant. How can I help you explore his expertise?";
                    setMessages([{ role: 'assistant', content: greeting }]);
                }
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [isOpen, messages, lang]);

            const handleSend = async () => {
                if (!input.trim() || isLoading) return;
                const userMsg = input;
                setInput('');
                setMessages(prev => [...prev, { role: 'user', content: userMsg }]);
                setIsLoading(true);

                try {
                    // Initialize AI only when needed for privacy/token usage
                    const ai = new GoogleGenAI({ apiKey: "AI_KEY" }); // Mocked for safety, would use process.env.API_KEY normally
                    
                    // Simple mock delay to simulate professional engagement
                    setTimeout(() => {
                        const responseText = lang === 'ar'
                            ? "محمد خبير في تحليل الأعمال والعمليات، ويجمع بين خلفية اقتصادية قوية وخبرة ميدانية واسعة في مشاريع ضخمة مثل موسم الحج."
                            : "Mohamed is an expert in Business and Operations Analysis, bridging a strong economic background with deep field experience in large-scale projects like Hajj operations.";
                        setMessages(prev => [...prev, { role: 'assistant', content: responseText }]);
                        setIsLoading(false);
                    }, 800);
                } catch (e) { setIsLoading(false); }
            };

            return (
                <div className={`fixed bottom-24 z-[200] ${lang === 'ar' ? 'right-6' : 'left-6'}`}>
                    {isOpen && (
                        <div className="mb-4 w-[320px] md:w-[380px] h-[500px] glass-card rounded-3xl overflow-hidden flex flex-col shadow-[0_40px_80px_rgba(0,0,0,0.6)] border border-[#006233]/30 animate-in fade-in slide-in-from-bottom-4 duration-500">
                            <div className="p-5 bg-gradient-to-br from-[#006233] to-[#070912] border-b border-white/10 flex justify-between items-center">
                                <div className="flex items-center gap-3"><Bot className="w-5 h-5 text-white" /><span className="text-white text-[10px] font-black uppercase tracking-widest">MI Strategy AI</span></div>
                                <button onClick={() => setIsOpen(false)}><X className="text-white w-4 h-4" /></button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-5 space-y-5 scrollbar-hide bg-[#0a0c1b]/95">
                                {messages.map((m, i) => (
                                    <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[85%] p-4 rounded-2xl text-xs leading-relaxed shadow-sm ${m.role === 'user' ? 'bg-[#c29b40] text-white rounded-tr-none' : 'bg-white/5 text-slate-300 rounded-tl-none font-light border border-white/5'}`}>{m.content}</div>
                                    </div>
                                ))}
                                {isLoading && <div className="flex items-center gap-2 text-[#c29b40] text-[9px] font-black uppercase animate-pulse"><Loader2 className="w-3 h-3 animate-spin" /> Analyzing...</div>}
                                <div ref={chatEndRef} />
                            </div>
                            <div className="p-5 bg-black/20 flex gap-2 border-t border-white/10">
                                <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSend()} placeholder="Ask something..." className="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white outline-none focus:border-[#c29b40] transition-colors" />
                                <button onClick={handleSend} className="p-2.5 bg-[#006233] rounded-xl text-white shadow-lg"><Send className="w-4 h-4" /></button>
                            </div>
                        </div>
                    )}
                    <button onClick={() => setIsOpen(!isOpen)} className="w-14 h-14 bg-[#070912] border-2 border-[#006233]/40 rounded-full shadow-2xl flex items-center justify-center text-[#006233] hover:scale-110 transition-all hover:border-[#006233]">
                        {isOpen ? <X /> : <Bot />}
                    </button>
                </div>
            );
        };

        const FloatingWhatsApp = ({ lang }) => (
            <a href={`https://wa.me/${CONTACT_INFO.whatsapp}`} target="_blank" className={`fixed bottom-6 z-[200] w-14 h-14 bg-[#25D366] rounded-full shadow-2xl flex items-center justify-center text-white hover:scale-110 transition-transform ${lang === 'ar' ? 'right-6' : 'left-6'}`}>
                <MessageSquare className="w-8 h-8 fill-white" />
            </a>
        );

        // --- MAIN APP ---
        const App = () => {
            const [lang, setLang] = useState('ar');
            useEffect(() => {
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                document.documentElement.lang = lang;
            }, [lang]);

            return (
                <div className="selection:bg-[#c29b40] selection:text-white">
                    <Navbar lang={lang} setLang={setLang} />
                    <main>
                        <Hero lang={lang} />
                        <About lang={lang} />
                        <Experience lang={lang} />
                        <Certifications lang={lang} />
                        <Skills lang={lang} />
                        <Contact lang={lang} />
                    </main>
                    <footer className="py-20 border-t border-white/5 text-center text-[10px] text-slate-500 font-bold uppercase tracking-[0.4em]">
                        © {new Date().getFullYear()} Mohamed Thwban Imijine. All Rights Reserved.
                    </footer>
                    <AIAssistant lang={lang} />
                    <FloatingWhatsApp lang={lang} />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
