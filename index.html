    <style>
        :root {
            --bg-color: #0b0d17;
            --card-bg: #161b22;
            --text-main: #ffffff;
            --text-dim: #8b949e;
            --accent: #238636;
            --red-btn: #d73a49;
        }

        body {
            margin: 0;

            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            line-height: 1.6;
        }

        header {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(22, 27, 34, 0.95);
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }

        .profile-section {
            text-align: center;
            background: var(--card-bg);

        }

        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid var(--accent);
            object-fit: cover;
            margin-bottom: 20px;
            background: #21262d;
        }

        .badge {
            background: var(--accent);
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .btn-lang {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-lang:hover { background: var(--accent); color: white; }

            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
        }
