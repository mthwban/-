<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohamed Thoban | Operations Specialist & Creative Strategist</title>
    
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
      :root { 
        --midnight-blue: #020617; 
        --gold: #D4AF37; 
      }
      body { 
        background-color: var(--midnight-blue); 
        color: #f1f5f9; 
        margin: 0; 
        overflow-x: hidden; 
      }
      
      #app-loader {
        position: fixed; inset: 0; background: #020617;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 10000; transition: opacity 0.6s ease;
      }
      .loader-container { position: relative; display: flex; align-items: center; justify-content: center; }
      .spinner {
        width: 80px; height: 80px; border: 2px solid rgba(212, 175, 55, 0.1);
        border-top-color: #D4AF37; border-radius: 50%; animation: spin 1s linear infinite;
      }
      .loader-logo {
        position: absolute; font-family: 'Inter', sans-serif; font-weight: 900;
        color: #D4AF37; font-size: 1.2rem;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      #fallback-error {
        display: none; position: fixed; inset: 0; background: #020617; color: white;
        flex-direction: column; align-items: center; justify-content: center;
        text-align: center; z-index: 9999; font-family: 'Cairo', sans-serif; padding: 20px;
      }
    </style>

    <script>
      // وظيفة عالمية لإخفاء التحميل يمكن استدعاؤها من أي مكان
      window.hideAppLoader = function() {
        const loader = document.getElementById('app-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => { loader.style.display = 'none'; }, 600);
        }
      };
      // إخفاء قسري بعد 4 ثوانٍ لضمان عدم بقاء الشاشة سوداء أبداً
      setTimeout(window.hideAppLoader, 4000);
    </script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0?external=react",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  </head>
  <body>
    <div id="app-loader">
      <div class="loader-container">
        <div class="spinner"></div>
        <div class="loader-logo">M.T</div>
      </div>
      <p style="margin-top: 20px; font-family: 'Cairo'; color: #D4AF37; font-size: 0.7rem; letter-spacing: 1px; opacity: 0.8;">جاري تحميل الملف الاستراتيجي...</p>
    </div>

    <div id="root"></div>
    
    <div id="fallback-error">
      <h2 style="color: #D4AF37;">عذراً، فشل تحميل النظام</h2>
      <p>يرجى تحديث الصفحة أو المحاولة من متصفح آخر.</p>
      <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 30px; background: #D4AF37; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">تحديث</button>
    </div>

    <!-- استخدام مسار نسبي بسيط لضمان التوافق مع GitHub Pages -->
    <script type="module" src="index.tsx"></script>
  </body>
</html>
