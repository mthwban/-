<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد ثوبان | محلل أعمال وعمليات استراتيجي</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body { background-color: #020617; color: #f1f5f9; font-family: 'Cairo', sans-serif; margin: 0; }
        #loading-screen { position: fixed; inset: 0; background: #020617; display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s ease-out; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(212, 175, 55, 0.1); border-top: 5px solid #D4AF37; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #root { min-height: 100vh; }
    </style>

    <!-- Import Map: تم توحيد الإصدارات بدقة مع استخدام ?deps لضمان وجود نسخة واحدة من React -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.244.0?deps=react@18.2.0",
    "@google/genai": "https://esm.sh/@google/genai@1.0.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>

    <!-- Babel Standalone للترجمة الفورية للكود -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="loading-screen">
        <div class="flex flex-col items-center gap-6">
            <div class="spinner"></div>
            <p id="loading-text" class="text-[#D4AF37] font-bold text-lg animate-pulse">جاري تشغيل منصة ثوبان الاستراتيجية...</p>
        </div>
    </div>

    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react,typescript">
        import './index.tsx';
        
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
            }, 800);
        });
    </script>
</body>
</html>
