    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^18.2.0",

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Inter:wght@300;400;600;800;900&display=swap');
        
        :root {
            --obsidian: #020617;
            --champagne: #D4AF37;
        }

        body {
            background-color: var(--obsidian);
            color: #f1f5f9;
            margin: 0;
            font-family: 'Cairo', 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reveal-up { animation: reveal 1s ease-out forwards; }
    </style>
</head>

    <!-- Note: type="text/babel" and data-type="module" allow loading TSX files directly -->
