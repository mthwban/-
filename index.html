                return () => observer.disconnect();
            }, []);

                return () => clearTimeout(timer);
            }, [isOpen]);

            useEffect(() => {
                if (isOpen && messages.length === 0) setMessages([{ role: 'assistant', content: UI_STRINGS.ai.greeting[lang] }]);
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [isOpen, messages, lang]);

            const handleSend = async () => {
                if (!input.trim() || isLoading) return;
                const userMessage = input.trim();
                setInput('');
                setMessages(prev => [...prev, { role: 'user', content: userMessage }]);
                setIsLoading(true);

                try {
                    const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });
                    const systemInstruction = `
                        You are the "Strategic Recruiter Assistant" for Mohamed Thwban Imijine. 
                        Identify: Mohamed is an Economist (UQU 2018), Business Analyst (Manasik Project), Modern Web Designer & Developer, and Certified Media Producer (Univ of Colorado Boulder).
                        Current Milestones: Mohamed has officially submitted his PMP application to PMI and is awaiting review. He is also completing Google Digital Marketing certification.
                        Expertise areas: Operational efficiency, professional visual documentation, and building high-performance digital architectures.
                        Career path: OIC-IBU Photographer -> Manasik Al-Mullabi Analyst -> Consulate committee -> Marketing -> Economics.
                        Tone: Highly professional, corporate, and outcome-oriented. 
                        Language: ${lang === 'ar' ? 'Strictly Arabic (Professional/Gulf business)' : 'Strictly English (High-end corporate)'}. No English in Arabic mode.
                    `;
                    const response = await ai.models.generateContent({
                        model: 'gemini-3-flash-preview',
                        contents: userMessage,
                        config: { systemInstruction }
                    });
                    setMessages(prev => [...prev, { role: 'assistant', content: response.text }]);
                } catch (e) {
                    setMessages(prev => [...prev, { role: 'assistant', content: lang === 'ar' ? "خطأ في الاتصال." : "Communication error." }]);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className={`fixed bottom-24 z-[70] flex flex-col no-print ${lang === 'ar' ? 'right-8 items-end' : 'left-8 items-start'}`}>
                    {showTooltip && !isOpen && (
                        <div className={`mb-4 max-w-[280px] p-6 glass-card rounded-3xl border border-[#c29b40]/30 shadow-2xl relative animate-in fade-in slide-in-from-bottom-4 duration-500 ${lang === 'ar' ? 'text-right' : 'text-left'}`}>
                            <button onClick={() => setShowTooltip(false)} className="absolute top-2 right-2 text-slate-500 hover:text-white transition-colors"><X className="w-3 h-3" /></button>
                            <p className="text-[11px] font-bold leading-relaxed text-slate-200">{UI_STRINGS.ai.tooltip[lang]}</p>
                            <div className={`absolute bottom-[-8px] w-4 h-4 glass-card border-b border-r border-[#c29b40]/30 rotate-45 ${lang === 'ar' ? 'right-6' : 'left-6'}`}></div>
                        </div>
                    )}
                    {isOpen && (
                        <div className="mb-4 w-[320px] md:w-[400px] h-[500px] glass-card rounded-[2.5rem] shadow-2xl flex flex-col overflow-hidden border border-white/10 animate-in fade-in zoom-in duration-300">
                            <div className={`p-6 bg-gradient-to-br from-[#006233] to-[#004d28] text-white flex justify-between items-center ${lang === 'ar' ? 'flex-row-reverse' : ''}`}>
                                <div className={`flex items-center gap-3 ${lang === 'ar' ? 'flex-row-reverse' : ''}`}><Bot className="w-5 h-5 text-[#c29b40]" /><div className={lang === 'ar' ? 'text-right' : ''}><h4 className="text-xs font-black uppercase tracking-widest">{lang === 'ar' ? 'المساعد الاستراتيجي' : 'MI Strategy AI'}</h4><p className="text-[8px] uppercase tracking-tighter text-[#c29b40]">{UI_STRINGS.ai.status[lang]}</p></div></div>
                                <button onClick={() => setIsOpen(false)} className="hover:rotate-90 transition-transform"><X className="w-5 h-5" /></button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-6 space-y-4 bg-[#0d1021] scrollbar-hide">
                                {messages.map((m, i) => (
                                    <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[85%] p-4 rounded-2xl text-xs ${m.role === 'user' ? 'bg-[#c29b40] text-black font-bold shadow-lg rounded-tr-none' : 'bg-white/5 border border-white/10 text-slate-200 rounded-tl-none'} ${lang === 'ar' ? 'text-right' : 'text-left'}`}>{m.content}</div>
                                    </div>
                                ))}
                                {isLoading && <div className="flex justify-start"><div className="bg-white/5 p-4 rounded-2xl animate-pulse text-[10px] text-slate-400 font-black uppercase tracking-widest">{UI_STRINGS.ai.thinking[lang]}</div></div>}
                                <div ref={chatEndRef} />
                            </div>
                            <div className="p-6 bg-[#070912] border-t border-white/5">
                                <div className="relative">
                                    <input type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSend()} placeholder="..." className={`w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-[#c29b40]/50 transition-all ${lang === 'ar' ? 'text-right pr-4 pl-12' : 'pl-4 pr-12'}`} />
                                    <button onClick={handleSend} disabled={!input.trim() || isLoading} className={`absolute top-2 p-1.5 bg-[#c29b40] rounded-lg text-black transition-all active:scale-90 disabled:opacity-30 ${lang === 'ar' ? 'left-2' : 'right-2'}`}><Send className="w-4 h-4" /></button>
                                </div>
                            </div>
                        </div>
                    )}
                    <button onClick={() => {setIsOpen(!isOpen); setShowTooltip(false);}} className={`w-14 h-14 rounded-full shadow-2xl flex items-center justify-center transition-all duration-500 z-50 ${isOpen ? 'bg-[#c29b40] rotate-90 scale-110' : 'bg-[#006233] border border-white/10 hover:scale-110 active:scale-90'}`}>
                        {isOpen ? <X className="text-black w-6 h-6" /> : <Bot className="text-white w-7 h-7" />}
                    </button>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('ar');
            useReveal();
            useEffect(() => {
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                document.documentElement.lang = lang;
            }, [lang]);
            return (
                <div className="selection:bg-[#c29b40] selection:text-[#070912]">
                    <Navbar lang={lang} setLang={setLang} />
                    <main>
                        <Hero lang={lang} />
                        <About lang={lang} />
                        <CareerJourney lang={lang} />
                        <Portfolio lang={lang} />
                        <Certifications lang={lang} />
                        <Skills lang={lang} />
                        <Contact lang={lang} />
                    </main>
                    <footer className="py-24 border-t border-white/5 text-center text-[11px] text-slate-600 font-black uppercase tracking-[0.5em] bg-[#070912]">
                        <div className="max-w-7xl mx-auto flex flex-col items-center gap-8">
                            <div className="text-2xl font-black text-white">{lang === 'ar' ? 'محمد' : 'IMAGINE'}<span className="text-[#c29b40]">.</span></div>
                            <p>© {new Date().getFullYear()} محمد ثوبان إميجن. {lang === 'ar' ? 'جميع الحقوق محفوظة.' : 'All Rights Reserved.'}</p>
                        </div>
                    </footer>
                    <AIAssistant lang={lang} />
                    <a href={`https://wa.me/${CONTACT_INFO.whatsapp}`} target="_blank" rel="noopener noreferrer" className={`fixed bottom-10 z-[200] w-16 h-16 bg-[#25D366] rounded-full shadow-2xl flex items-center justify-center text-white hover:scale-110 hover:-translate-y-2 transition-all no-print ${lang === 'ar' ? 'right-10' : 'left-10'}`}><MessageSquare className="w-8 h-8 fill-white" /></a>
                </div>
            );
        };
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
