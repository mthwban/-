                  <div className="flex flex-wrap justify-center gap-12 mb-32">
                    <a href={`mailto:${CONTACT_INFO.email}`} className="flex items-center gap-4 text-slate-400 hover:text-[#ffd700] transition-colors group">
                      <Mail className="w-8 h-8 group-hover:scale-110" />
                      <span className="text-xl font-bold uppercase tracking-widest">{CONTACT_INFO.email}</span>
                    </a>
                    <a href={CONTACT_INFO.linkedin} target="_blank" className="flex items-center gap-4 text-slate-400 hover:text-[#ffd700] transition-colors group">
                      <Linkedin className="w-8 h-8 group-hover:scale-110" />
                      <span className="text-xl font-bold uppercase tracking-widest">LinkedIn</span>
                    </a>
                  </div>
                  <div className="pt-12 border-t border-white/5 text-slate-600 text-[10px] font-black uppercase tracking-[0.5em]">
                    © {new Date().getFullYear()} MOHAMED THEUBANE • STRATEGIC ANALYST
                  </div>
                </div>
              </section>

              {/* AI Assistant Button & FAB */}
              <div className={`fixed bottom-8 z-[100] no-print ${lang === 'ar' ? 'left-8' : 'right-8'}`}>
                <AIAssistant lang={lang} />
              </div>
              <div className={`fixed bottom-8 z-[60] no-print ${lang === 'ar' ? 'right-8' : 'left-8'}`}>
                <a href={`https://wa.me/${CONTACT_INFO.whatsapp}`} target="_blank" className="w-16 h-16 bg-[#25D366] rounded-full flex items-center justify-center text-white shadow-2xl hover:scale-110 transition-all">
                  <MessageCircle className="w-8 h-8 fill-white" />
                </a>
              </div>

            </div>
          );
        };

        const AIAssistant = ({ lang }) => {
          const [isOpen, setIsOpen] = useState(false);
          const [messages, setMessages] = useState([]);
          const [input, setInput] = useState('');
          const [isTyping, setIsTyping] = useState(false);

          const handleSend = async () => {
            if (!input.trim() || isTyping) return;
            const txt = input; setInput(''); setMessages(prev => [...prev, {role:'user', text:txt}]); setIsTyping(true);
            try {
              const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });
              const res = await ai.models.generateContent({
                model: 'gemini-3-flash-preview',
                contents: txt,
                config: { systemInstruction: lang === 'ar' ? 
                  `أنت 'المساعد الاستراتيجي لمحمد ثوبان'. محمد ابن مكة المكرمة (مواليد المملكة العربية السعودية)، خبير عمليات (10 سنوات حشود) ومحلل اقتصادي (جامعة أم القرى). 
                  القيمة الجوهرية: محمد يتميز بقدرة عالية على صياغة التقارير التحليلية والتشغيلية (الاحترافية في صياغة التقارير). 
                  إجمالي الساعات المعتمدة: 200+ ساعة (158 ساعة من جوجل، 19 من وزارة الحج). تحدث باللغة العربية الفصحى المهنية فقط.` :
                  `You are Mohammed Theubane's Strategic Assistant. He is a KSA-born Operations Specialist and Economic Analyst. 
                  Key Strength: Professional Reporting and Operational Analysis. Total Hours: 200+ (Google PM 158h, Hajj 19h). Speak professional English only.`
                }
              });
              setMessages(prev => [...prev, {role:'bot', text: res.text || "..."}]);
            } catch { setMessages(prev => [...prev, {role:'bot', text: "Error."}]); }
            finally { setIsTyping(false); }
          };

          return (
            <div className="relative">
              {isOpen && (
                <div className="absolute bottom-20 w-80 md:w-96 h-[500px] bg-[#112240] border border-[#ffd700]/20 rounded-[2.5rem] flex flex-col overflow-hidden shadow-2xl animate-fade-in">
                  <div className="p-6 bg-[#0a192f] flex justify-between items-center border-b border-[#ffd700]/10">
                    <div className="flex items-center gap-3"><Bot className="w-6 h-6 text-[#ffd700]" /><span className="font-black text-[10px] text-white uppercase tracking-widest">{lang === 'ar' ? 'المساعد الذكي' : 'Assistant'}</span></div>
                    <button onClick={() => setIsOpen(false)}><X className="text-white" /></button>
                  </div>
                  <div className="flex-1 overflow-y-auto p-6 space-y-4">
                    {messages.length === 0 && <div className="p-4 bg-white/5 border border-white/10 rounded-2xl text-sm leading-relaxed">{lang === 'ar' ? 'أهلاً بك، كيف يمكنني مساعدتك في التعرف على القيمة التشغيلية لمحمد؟' : 'Hello, how can I help you explore Mohammed’s operational value?'}</div>}
                    {messages.map((m, i) => (
                      <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[85%] p-4 rounded-2xl text-sm leading-relaxed ${m.role === 'user' ? 'bg-[#ffd700] text-black font-bold' : 'bg-white/5 border border-white/10 text-slate-200'}`}>{m.text}</div>
                      </div>
                    ))}
                    {isTyping && <div className="text-[#ffd700] animate-pulse text-[10px] font-black px-2 uppercase tracking-widest">{lang === 'ar' ? 'جاري التحليل...' : 'Analyzing...'}</div>}
                  </div>
                  <div className="p-4 bg-[#112240] border-t border-[#ffd700]/10 flex gap-2">
                    <input value={input} onChange={e => setInput(e.target.value)} onKeyPress={e => e.key === 'Enter' && handleSend()} className="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none" placeholder="..." />
                    <button onClick={handleSend} className="p-3 bg-[#ffd700] rounded-xl text-black"><Send className="w-5 h-5" /></button>
                  </div>
                </div>
              )}
              <button onClick={() => setIsOpen(!isOpen)} className="w-16 h-16 bg-[#ffd700] text-black rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition-all"><MessageSquare className="w-8 h-8" /></button>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
