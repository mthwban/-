    <!-- Fonts & Icons -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-primary: #006233;
            --color-secondary: #c29b40;
            --color-bg: #070912;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Plus Jakarta Sans', 'IBM Plex Sans Arabic', sans-serif;
            background-color: var(--color-bg);
            color: #f8fafc;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        [dir="rtl"] { 
            font-family: 'IBM Plex Sans Arabic', 'Plus Jakarta Sans', sans-serif; 
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gold-border { border: 1px solid var(--color-secondary); }
        .gold-text { color: var(--color-secondary); }
        .gold-bg { background-color: var(--color-secondary); }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        @media print {
            .no-print { display: none !important; }
        }

        /* Smooth scroll margin for navbar */
        section { scroll-margin-top: 5rem; }
    </style>
