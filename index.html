    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Inter:wght@300;400;600;800;900&display=swap');
        
        :root {
            --obsidian: #020617;
            --champagne: #D4AF37;
        }

        body {
            background-color: var(--obsidian);
            color: #f1f5f9;
            margin: 0;
            font-family: 'Cairo', 'Inter', sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: var(--champagne);
            background: rgba(15, 23, 42, 0.6);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -20px rgba(212, 175, 55, 0.2);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--obsidian);
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--champagne);
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reveal-up { animation: reveal 1s ease-out forwards; }

        @media print {
            .no-print { display: none !important; }
        }
    </style>
