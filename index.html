        :root {

                items: [{ en: "UI/UX Design", ar: "تصميم واجهة المستخدم" }, { en: "Front-End Development", ar: "تطوير الواجهات" }, { en: "Digital Identity", ar: "الهوية الرقمية" }]

            { title: { en: "Business Analyst", ar: "محلل أعمال" }, company: { en: "Manasik Al-Mullabi (RC Project)", ar: "شركة مناسك الملبي (مشروع الهيئة الملكية)" }, period: { en: "10/2024 – 10/2025", ar: "١٠/٢٠٢٤ – ١٠/٢٠٢٥" }, icon: <Briefcase /> },
            { title: { en: "Committee Member", ar: "عضو لجنة تنظيمية" }, company: { en: "Consulate of Mauritania", ar: "القنصلية الموريتانية" }, period: { en: "2023", ar: "٢٠٢٣" }, icon: <ShieldCheck /> },
            { title: { en: "Marketing Specialist", ar: "أخصائي تسويق" }, company: { en: "Transport Sector", ar: "قطاع النقل والمقاولات" }, period: { en: "2020 – 2023", ar: "٢٠٢٠ – ٢٠٢٣" }, icon: <TrendingUp /> },

        const Navbar = ({ lang, setLang }) => {
            const [isScrolled, setIsScrolled] = useState(false);
            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 left-0 w-full z-[100] transition-all px-4 md:px-8 ${isScrolled ? 'py-4' : 'py-8'}`}>
                    <div className={`max-w-7xl mx-auto flex justify-between items-center px-8 py-3.5 rounded-3xl transition-all ${isScrolled ? 'glass-card shadow-2xl' : 'bg-transparent'}`}>
                        <button onClick={() => setLang(lang === 'en' ? 'ar' : 'en')} className="px-4 py-1.5 rounded-xl bg-[#c29b40]/10 border border-[#c29b40]/20 text-[10px] font-black text-[#c29b40] no-print">

                        </button>
                        <div className="text-2xl font-black text-white">IM<span className="text-[#c29b40]">.</span></div>
                        <div className="hidden lg:flex gap-10">
                            {['about', 'experience', 'portfolio', 'skills'].map(id => (

                            ))}
                        </div>
                    </div>
                </nav>
            );
        };

        const AIAssistant = ({ lang }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [showTooltip, setShowTooltip] = useState(false);
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const chatEndRef = useRef(null);

            useEffect(() => {
                const timer = setTimeout(() => { if (!isOpen) setShowTooltip(true); }, 3000);
                return () => clearTimeout(timer);
            }, [isOpen]);

            useEffect(() => {
                if (isOpen && messages.length === 0) setMessages([{ role: 'assistant', content: UI_STRINGS.ai.greeting[lang] }]);
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [isOpen, messages, lang]);

            const handleSend = async () => {
                if (!input.trim() || isLoading) return;
                const userMsg = input.trim(); setInput('');
                setMessages(prev => [...prev, { role: 'user', content: userMsg }]);
                setIsLoading(true);
                try {
                    const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });
                    const systemInstruction = `
                        You are "Mohammed's Smart Recruitment Consultant". 
                        Rules: 
                        1. Respond in BRIEF bullet points only. No long paragraphs.
                        2. Tone: Professional, Saudi business style.
                        3. If asked about hiring/roles, categorize as follows:
                           - العمليات واللوجستيات: (مشرف ميداني، أخصائي امتثال، محلل أداء). Context: monitored 810 units, July 16/20 reports.
                           - التقنية: (مطور مواقع، مصمم هويات رقمية).
                           - الإعلام: (منتج فيديو معتمد من جامعة كولورادو، مصور مشاريع).
                        4. Language: ${lang === 'ar' ? '100% Arabic (No English words)' : 'Professional English'}.
                        5. Suggest the CV link at the end: ${CONTACT_INFO.resume}
                    `;
                    const response = await ai.models.generateContent({
                        model: 'gemini-3-flash-preview',
                        contents: userMsg,
                        config: { systemInstruction }
                    });
                    setMessages(prev => [...prev, { role: 'assistant', content: response.text }]);
                } catch (e) {
                    setMessages(prev => [...prev, { role: 'assistant', content: lang === 'ar' ? "خطأ في الاتصال." : "Connection error." }]);
                } finally { setIsLoading(false); }
            };

            return (
                <div className={`fixed bottom-24 z-[70] flex flex-col no-print ${lang === 'ar' ? 'right-8 items-end' : 'left-8 items-start'}`}>
                    {showTooltip && !isOpen && (
                        <div className="mb-4 max-w-[280px] p-5 glass-card rounded-2xl border border-[#c29b40]/40 animate-in fade-in slide-in-from-bottom-4">
                            <p className="text-[12px] font-bold text-slate-200">{UI_STRINGS.ai.tooltip[lang]}</p>
                        </div>
                    )}
                    {isOpen && (
                        <div className="mb-4 w-[320px] md:w-[400px] h-[500px] glass-card rounded-[2.5rem] flex flex-col overflow-hidden border border-white/10 animate-in zoom-in">
                            <div className={`p-6 bg-[#006233] text-white flex justify-between items-center ${lang === 'ar' ? 'flex-row-reverse' : ''}`}>

                                <button onClick={() => setIsOpen(false)}><X /></button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-6 space-y-4 bg-[#0d1021] scrollbar-hide">
                                {messages.map((m, i) => (
                                    <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[85%] p-4 rounded-2xl text-xs ${m.role === 'user' ? 'bg-[#c29b40] text-black font-bold' : 'bg-white/5 text-slate-200'} ${lang === 'ar' ? 'text-right' : 'text-left'}`}>{m.content}</div>
                                    </div>
                                ))}
                                {isLoading && <div className="text-emerald-400 text-[10px] animate-pulse">{UI_STRINGS.ai.thinking[lang]}</div>}
                                <div ref={chatEndRef} />
                            </div>
                            <div className="p-6 bg-[#070912] border-t border-white/5">
                                <div className="relative">
                                    <input type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSend()} className={`w-full bg-white/5 rounded-xl py-3 px-4 text-xs text-white ${lang === 'ar' ? 'text-right' : ''}`} placeholder="..." />

                    )}

                        {isOpen ? <X className="text-white" /> : <Bot className="text-white" />}
                    </button>
                </div>
            );
        };

        const Hero = ({ lang }) => (

                            <div key={i} className="glass-card aspect-[4/5] rounded-[3.5rem] flex flex-col justify-center items-center p-10 border-dashed border-white/10 group hover:border-[#c29b40]/30">
                                <Sparkles className="w-12 h-12 text-slate-800 mb-8 group-hover:text-[#c29b40]" />
                                <h4 className="text-2xl font-black text-white mb-4 text-center">{lang === 'ar' ? title : ['Web Projects', 'Media Gallery', 'Analysis Reports'][i]}</h4>
                                <p className="text-slate-600 text-center text-sm">{lang === 'ar' ? 'مساحة مخصصة للأعمال القادمة.' : 'Reserved for upcoming professional works.'}</p>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Certifications = ({ lang }) => (
            <section id="certifications" className="py-40 bg-[#070912] px-8">
                <div className="max-w-7xl mx-auto">
                    <div className={`flex flex-col md:flex-row justify-between items-end mb-24 gap-10 ${lang === 'ar' ? 'md:flex-row-reverse' : ''}`}>
                        <div className={lang === 'ar' ? 'text-right' : 'text-left'}>
                            <span className="text-[#c29b40] text-[11px] font-black uppercase mb-4 block">Credentials</span>
                            <h3 className="text-5xl md:text-6xl font-black text-white tracking-tighter">{UI_STRINGS.nav.certifications[lang]}</h3>
                        </div>
                        <a href={CONTACT_INFO.resume} target="_blank" className="px-10 py-5 bg-[#c29b40] text-black font-black rounded-2xl flex items-center gap-4 text-xs uppercase"><FileDown /> {UI_STRINGS.certs.cta[lang]}</a>
                    </div>
                    <div className="grid md:grid-cols-3 gap-8">
                        <div className="glass-card p-10 rounded-[3rem] border-[#c29b40]/30 shadow-2xl">
                            <Clock className="w-10 h-10 text-[#c29b40] mb-8" />
                            <h4 className="text-xl font-black text-white mb-2 leading-tight">PMP - مدير مشروع محترف</h4>
                            <p className="text-slate-500 text-sm mb-6">PMI - معهد إدارة المشاريع</p>
                            <p className="text-[10px] text-[#c29b40] font-black uppercase tracking-widest bg-[#c29b40]/10 p-4 rounded-xl">تم تقديم الطلب - بانتظار المراجعة والاختبار</p>
                        </div>
                        <div className="glass-card p-10 rounded-[3rem]">
                            <Award className="w-10 h-10 text-emerald-500 mb-8" />
                            <h4 className="text-xl font-black text-white mb-2 leading-tight">إنتاج الفيديو والمونتاج</h4>
                            <p className="text-slate-500 text-sm">جامعة كولورادو بولدر</p>
                        </div>
                        <div className="glass-card p-10 rounded-[3rem]">
                            <Award className="w-10 h-10 text-emerald-500 mb-8" />
                            <h4 className="text-xl font-black text-white mb-2 leading-tight">إدارة مشاريع جوجل</h4>
                            <p className="text-slate-500 text-sm">جوجل / كورسيرا</p>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Skills = ({ lang }) => (
            <section id="skills" className="py-40 px-8 bg-[#0d1021]">
                <div className="max-w-7xl mx-auto">
                    <h2 className="text-5xl md:text-7xl font-black text-white text-center mb-24 tracking-tighter">{UI_STRINGS.nav.skills[lang]}</h2>
                    <div className="grid md:grid-cols-3 gap-10">
                        {SKILLS_LIST.map((skill, i) => (
                            <div key={i} className={`glass-card p-14 rounded-[4rem] group ${lang === 'ar' ? 'text-right' : 'text-left'}`}>
                                <div className="w-16 h-16 glass-card rounded-2xl flex items-center justify-center mb-10 text-2xl">{skill.icon}</div>
                                <h4 className="text-2xl font-black text-white mb-10 group-hover:text-[#c29b40] transition-colors">{skill.category[lang]}</h4>
                                <div className={`flex flex-wrap gap-3 ${lang === 'ar' ? 'flex-row-reverse' : ''}`}>{skill.items.map((item, idx) => (<span key={idx} className="px-4 py-2 glass-card rounded-xl text-[10px] font-black uppercase text-slate-400">{item[lang]}</span>))}</div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const App = () => {
            const [lang, setLang] = useState('ar');
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); });
                }, { threshold: 0.1 });
                document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                document.documentElement.lang = lang;
            }, [lang]);

            return (
                <div className="selection:bg-[#c29b40] selection:text-black">
                    <Navbar lang={lang} setLang={setLang} />
                    <main>
                        <Hero lang={lang} />
                        <About lang={lang} />
                        <Career lang={lang} />
                        <Portfolio lang={lang} />
                        <Certifications lang={lang} />
                        <Skills lang={lang} />
                    </main>
                    <footer className="py-24 border-t border-white/5 text-center bg-[#070912]">
                        <div className="text-2xl font-black text-white mb-4 uppercase">IMAGINE<span className="text-[#c29b40]">.</span></div>
                        <p className="text-[10px] text-slate-600 font-black uppercase tracking-[0.5em]">© {new Date().getFullYear()} Mohamed Imijine. All Rights Reserved.</p>
                    </footer>
                    <AIAssistant lang={lang} />
                    <a href={`https://wa.me/${CONTACT_INFO.whatsapp}`} className="fixed bottom-10 z-[200] w-16 h-16 bg-[#25D366] rounded-full shadow-2xl flex items-center justify-center text-white no-print hover:scale-110 transition-all right-10"><MessageSquare className="w-8 h-8 fill-white" /></a>
                </div>
            );
        };
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
